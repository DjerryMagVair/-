[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = false
evm_version = "cancun"
offline = true
auto_detect_solc = true

[rpc_endpoints]
ethereum = "https://ethereum.publicnode.com"
base = "https://mainnet.base.org"
arbitrum = "https://arb1.arbitrum.io/rpc"
bsc = "https://bsc-dataseed.binance.org"

[fuzz]
runs = 64
